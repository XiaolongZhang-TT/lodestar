<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5fb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0d0f17" />
  <title>Lodestar · 我的导航</title>
  <link rel="stylesheet" href="style.css?v=9" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="page">
    <!-- 顶部：时钟 + 问候语 + 主题切换 -->
    <header class="hero">
      <button class="theme-toggle" id="themeToggle" title="切换明暗主题" aria-label="切换明暗主题">
        <svg class="icon-sun"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>

      <div class="clock-time">
        <span id="time">--:--</span><span class="clock-sec" id="sec">--</span>
      </div>
      <div class="clock-date" id="date"></div>
      <h1 class="greeting" id="greeting">你好</h1>
    </header>

    <!-- 本地筛选（按 / 聚焦） -->
    <div class="filter-bar">
      <input id="filterInput" type="text" placeholder="筛选书签…（按 / 聚焦）" spellcheck="false" />
    </div>

    <!-- 书签分类（由 app.js 从 /api/data 渲染） -->
    <main id="categories" class="categories"></main>

    <footer class="footer">书签在 <a href="/admin">后台管理</a> 中维护</footer>
  </div>

  <script src="app.js?v=9"></script>
</body>
</html>
