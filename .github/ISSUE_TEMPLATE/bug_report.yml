name: Bug 报告 / Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请确认：
        - 使用的是最新版本（或最新 `main`）
        - 已经搜索过已有 issue
        - **安全漏洞请勿在此公开**，请按 [SECURITY.md](https://github.com/XiaolongZhang-dev/lodestar/blob/main/SECURITY.md) 私密报告

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的结果是什么？
      placeholder: 简要描述问题，必要时附上截图。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽可能给出最小、稳定的复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker / docker compose
        - 本机直接运行（python3 server.py）
        - 其他（请在环境信息中说明）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 镜像标签、Release 版本或 commit hash
      placeholder: "例如 v1.0.0 / 9c51c79"

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      placeholder: |
        浏览器: Chrome 130 / Safari 18
        系统: macOS 15 / 群晖 DSM 7.2 / Ubuntu 24.04
        Python: 3.12
        反向代理: Nginx / Caddy / 无

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 控制台报错
      description: 服务端日志或浏览器 Console 报错；请先遮挡真实域名、账号等隐私信息
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 issue，确认不是重复问题
          required: true
        - label: 我确认内容中不包含真实书签、域名、密码等隐私信息
          required: true
