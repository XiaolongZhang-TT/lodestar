name: 功能建议 / Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先搜索已有 issue，避免重复。也欢迎直接提交 PR。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个功能要解决什么痛点？现在的做法为什么不够好？
      placeholder: 例如：在手机主屏使用时，希望 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它以什么方式工作？如果有界面草图或交互说明更好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他实现方式，或现成的类似项目可以参考？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 前台页面 / 交互
        - 后台管理
        - 数据与 API
        - 图标解析
        - 部署 / Docker
        - 文档 / 测试
        - 其他

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 issue，确认不是重复建议
          required: true
